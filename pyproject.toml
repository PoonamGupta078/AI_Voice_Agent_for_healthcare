[project]
name = "careloop"
version = "0.1.0"
description = "CareLoop: A Stateful, Evidence-Grounded, Safety-Constrained Voice Agent"
authors = [
    {name = "Antigravity", email = "antigravity@google.com"},
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "simpleeval>=0.9.13",
    "altair>=5.0.0",
    "google-generativeai>=0.8.3",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["careloop*"]
